<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Deep Chats — Compendium of Questions for Deep and Meaningful Chats{% endblock %}</title>
    <meta name="description" content="A compendium of questions to kick-start deep and meaningful conversations.">
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong colours -->
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ rel_url('static', filename='style.css') }}">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="container">
        <header>
            <h1 class="site-title"><a href="{{ rel_url('home') }}">Compendium of Questions for Deep and Meaningful Chats</a></h1>
            <hr>
            <!-- Navigation Bar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light" aria-label="Main navigation">
              <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>

              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mr-auto">
                  <li class="nav-item{% if request.path == '/' %} active{% endif %}">
                    <a class="nav-link" href="{{ rel_url('home') }}">Home{% if request.path == '/' %} <span class="sr-only">(current)</span>{% endif %}</a>
                  </li>
                  <li class="nav-item{% if request.path == '/about.html' %} active{% endif %}">
                    <a class="nav-link" href="{{ rel_url('about') }}">About</a>
                  </li>
                  <li class="nav-item{% if request.path.startswith('/tags') %} active{% endif %}">
                    <a class="nav-link" href="{{ rel_url('tags_index') }}">Tags</a>
                  </li>
                  <li class="nav-item">
                    <button class="nav-link btn btn-link" id="surprise-btn" type="button">Surprise me</button>
                  </li>
                </ul>
                <form class="form-inline my-2 my-lg-0" role="search" action="{{ rel_url('home') }}index.html" method="get">
                  <label class="sr-only" for="site-search">Search questions</label>
                  <input class="form-control mr-sm-2" type="search" id="site-search" name="q" placeholder="Search questions" aria-label="Search questions" autocomplete="off">
                  <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
                  <button class="btn btn-outline-secondary my-2 my-sm-0 ml-2" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Toggle dark mode">🌙</button>
                </form>
              </div>
            </nav>
        </header>

        <main id="main">
          {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
          <p class="text-muted mb-0">Browse by <a href="{{ rel_url('tags_index') }}">tag</a>, search above, or hit <strong>Surprise me</strong> to get a random question.</p>
        </footer>
     </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="{{ rel_url('static', filename='search.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
